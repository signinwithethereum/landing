<?xml version="1.0" encoding="UTF-8"?>
<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Aurora spectrum gradient - spreads upward from the line -->
    <linearGradient id="auroraSpectrum1" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#00E676" stop-opacity="0.9"/>
      <stop offset="15%" stop-color="#00E676" stop-opacity="0.7"/>
      <stop offset="35%" stop-color="#1DE9B6" stop-opacity="0.5"/>
      <stop offset="55%" stop-color="#00BCD4" stop-opacity="0.35"/>
      <stop offset="75%" stop-color="#7C4DFF" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#AA00FF" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="auroraSpectrum2" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#69F0AE" stop-opacity="0.8"/>
      <stop offset="20%" stop-color="#00E5FF" stop-opacity="0.55"/>
      <stop offset="45%" stop-color="#40C4FF" stop-opacity="0.38"/>
      <stop offset="70%" stop-color="#B388FF" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#E040FB" stop-opacity="0"/>
    </linearGradient>

    <!-- Third spectrum layer for depth -->
    <linearGradient id="auroraSpectrum3" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#00FF88" stop-opacity="0.6"/>
      <stop offset="30%" stop-color="#00FFCC" stop-opacity="0.4"/>
      <stop offset="60%" stop-color="#00BFFF" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#9966FF" stop-opacity="0"/>
    </linearGradient>

    <!-- Soft glow filter - heavy blur for blending -->
    <filter id="softGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Extra soft filter for subtle accents -->
    <filter id="extraSoft" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="blur"/>
      </feMerge>
    </filter>

    <!-- Clip to circle -->
    <clipPath id="circleClip">
      <circle cx="256" cy="256" r="256"/>
    </clipPath>
  </defs>

  <!-- Background Night Sky -->
  <circle cx="256" cy="256" r="256" fill="#080810"/>

  <!-- Stars - scattered across the sky -->
  <g fill="white">
    <circle cx="95" cy="95" r="1.5" opacity="0.9"/>
    <circle cx="420" cy="75" r="1.8" opacity="0.85"/>
    <circle cx="180" cy="60" r="1.2" opacity="0.7"/>
    <circle cx="320" cy="90" r="1.5" opacity="0.8"/>
    <circle cx="55" cy="160" r="1" opacity="0.6"/>
    <circle cx="470" cy="140" r="1.5" opacity="0.75"/>
    <circle cx="250" cy="50" r="1.8" opacity="0.9"/>
    <circle cx="380" cy="130" r="1" opacity="0.65"/>
    <circle cx="130" cy="120" r="1.3" opacity="0.7"/>
    <circle cx="440" cy="200" r="1" opacity="0.55"/>
    <circle cx="70" cy="240" r="1.5" opacity="0.8"/>
    <circle cx="490" cy="280" r="1.2" opacity="0.6"/>
    <circle cx="40" cy="350" r="1" opacity="0.5"/>
    <circle cx="200" cy="420" r="1.3" opacity="0.65"/>
    <circle cx="350" cy="450" r="1" opacity="0.5"/>
    <circle cx="480" cy="380" r="1.5" opacity="0.7"/>
    <circle cx="150" cy="470" r="1" opacity="0.55"/>
    <circle cx="400" cy="480" r="1.2" opacity="0.6"/>
  </g>

  <!-- Aurora content clipped to circle -->
  <g clip-path="url(#circleClip)">

    <!-- Aurora Spectrum Fills - layered for depth -->

    <!-- Main spectrum fill - covers most of upper area -->
    <path fill="url(#auroraSpectrum1)">
      <animate
        attributeName="d"
        dur="6s"
        repeatCount="indefinite"
        values="
          M -20,340 Q 100,280 200,260 Q 300,240 400,200 Q 500,160 540,120 L 540,-20 L -20,-20 Z;
          M -20,360 Q 120,300 220,270 Q 320,240 420,220 Q 500,200 540,160 L 540,-20 L -20,-20 Z;
          M -20,340 Q 100,280 200,260 Q 300,240 400,200 Q 500,160 540,120 L 540,-20 L -20,-20 Z"
      />
    </path>

    <!-- Secondary spectrum fill -->
    <path fill="url(#auroraSpectrum2)" opacity="0.85">
      <animate
        attributeName="d"
        dur="5s"
        repeatCount="indefinite"
        values="
          M -20,400 Q 80,340 180,310 Q 280,280 380,260 Q 480,240 540,200 L 540,50 L -20,50 Z;
          M -20,380 Q 100,320 200,300 Q 300,280 400,250 Q 500,220 540,180 L 540,50 L -20,50 Z;
          M -20,400 Q 80,340 180,310 Q 280,280 380,260 Q 480,240 540,200 L 540,50 L -20,50 Z"
      />
    </path>

    <!-- Third spectrum layer -->
    <path fill="url(#auroraSpectrum3)" opacity="0.7">
      <animate
        attributeName="d"
        dur="4.5s"
        repeatCount="indefinite"
        values="
          M -20,370 Q 90,310 190,285 Q 290,260 390,235 Q 490,210 540,175 L 540,80 L -20,80 Z;
          M -20,355 Q 110,295 210,275 Q 310,255 410,225 Q 500,195 540,160 L 540,80 L -20,80 Z;
          M -20,370 Q 90,310 190,285 Q 290,260 390,235 Q 490,210 540,175 L 540,80 L -20,80 Z"
      />
    </path>

    <!-- Blended bright areas - smooth flowing curves -->

    <!-- Brightest band - wide, blurred, integrated -->
    <path
      stroke="#00FF99"
      stroke-width="25"
      stroke-linecap="round"
      fill="none"
      opacity="0.35"
      filter="url(#softGlow)"
    >
      <animate
        attributeName="d"
        dur="5s"
        repeatCount="indefinite"
        values="
          M -10,320 C 80,280 180,270 270,240 C 360,210 450,175 530,140;
          M -10,335 C 90,295 190,280 280,255 C 370,225 460,185 530,155;
          M -10,320 C 80,280 180,270 270,240 C 360,210 450,175 530,140"
      />
    </path>

    <!-- Upper bright band -->
    <path
      stroke="#00FFBB"
      stroke-width="20"
      stroke-linecap="round"
      fill="none"
      opacity="0.3"
      filter="url(#softGlow)"
    >
      <animate
        attributeName="d"
        dur="6s"
        repeatCount="indefinite"
        values="
          M -10,260 C 70,225 160,205 250,180 C 340,155 440,125 530,100;
          M -10,275 C 80,240 170,215 260,195 C 350,170 445,140 530,115;
          M -10,260 C 70,225 160,205 250,180 C 340,155 440,125 530,100"
      />
    </path>

    <!-- Lower bright band -->
    <path
      stroke="#00FF88"
      stroke-width="22"
      stroke-linecap="round"
      fill="none"
      opacity="0.32"
      filter="url(#softGlow)"
    >
      <animate
        attributeName="d"
        dur="4.5s"
        repeatCount="indefinite"
        values="
          M -10,380 C 80,345 180,320 270,295 C 360,270 455,235 530,200;
          M -10,370 C 90,335 190,305 280,280 C 370,255 460,220 530,185;
          M -10,380 C 80,345 180,320 270,295 C 360,270 455,235 530,200"
      />
    </path>

    <!-- Subtle top accent -->
    <path
      stroke="#00FFCC"
      stroke-width="15"
      stroke-linecap="round"
      fill="none"
      opacity="0.2"
      filter="url(#extraSoft)"
    >
      <animate
        attributeName="d"
        dur="7s"
        repeatCount="indefinite"
        values="
          M -10,210 C 60,180 150,155 240,135 C 330,115 430,85 530,60;
          M -10,220 C 70,190 160,165 250,145 C 340,125 435,95 530,70;
          M -10,210 C 60,180 150,155 240,135 C 330,115 430,85 530,60"
      />
    </path>

    <!-- Subtle bottom accent -->
    <path
      stroke="#1DE9B6"
      stroke-width="18"
      stroke-linecap="round"
      fill="none"
      opacity="0.22"
      filter="url(#extraSoft)"
    >
      <animate
        attributeName="d"
        dur="5.5s"
        repeatCount="indefinite"
        values="
          M -10,430 C 80,400 180,375 270,350 C 360,325 455,290 530,260;
          M -10,420 C 90,390 190,360 280,335 C 370,310 460,275 530,245;
          M -10,430 C 80,400 180,375 270,350 C 360,325 455,290 530,260"
      />
    </path>

  </g>
</svg>
